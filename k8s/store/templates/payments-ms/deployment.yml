apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: payments-ms
  name: payments-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-ms
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: payments-ms
    spec:
      containers:
      - image: northamerica-south1-docker.pkg.dev/store-microservices-453209/image-registry/payments-ms
        name: payments-ms
        env:
        - name: PORT
          value: "3003"
        - name: NATS_SERVERS
          value: "nats://nats"
        - name: PAYMENTS_SUCCESS_URL
          value: "http://localhost:3003/payments/success"
        - name: PAYMENTS_CANCEL_URL
          value: "http://localhost:3003/payments/cancel"
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: payments-ms-secrets
              key: STRIPE_SECRET_KEY
        - name: STRIPE_ENDPOINT_SECRET
          valueFrom:
            secretKeyRef:
              name: payments-ms-secrets
              key: STRIPE_ENDPOINT_SECRET

        - name: STRIPE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: payments-ms-secrets
              key: STRIPE_PUBLIC_KEY
        resources: {}
status: {}
